<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Universo 3D — Gemini 3.7 Flash (Antigravity CLI)</title>
  <meta name="description" content="Simulación 3D interactiva del Sistema Solar completo con BabylonJS: órbitas Keplerianas elípticas, sistema de lunas (Luna, Fobos, Deimos, Galileanas, Titán, Tritón), cometa Halley con cola vectorial anti-solar, cinturón de asteroides instanciado, nebulosas orgánicas procedurales, post-procesado y panel de control glassmorphism." />

  <!-- Estilos CSS Autocontenidos -->
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       RESET CSS Y SISTEMA DE DISEÑO GLASSMORPHISM
       ═══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-panel: rgba(10, 15, 30, 0.85);
      --border-panel: rgba(120, 160, 255, 0.35);
      --accent: #4f8cf6;
      --accent-hover: #70a4ff;
      --accent-glow: rgba(79, 140, 246, 0.45);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --panel-blur: blur(16px);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body.theme-classic {
      --bg-panel: rgba(20, 25, 40, 0.9);
      --border-panel: rgba(200, 170, 110, 0.4);
      --accent: #d4af37;
      --accent-hover: #f3cf58;
      --accent-glow: rgba(212, 175, 55, 0.45);
      --text-main: #fcfbf7;
      --text-muted: #a8a29e;
    }

    body.theme-dark {
      --bg-panel: rgba(5, 7, 14, 0.94);
      --border-panel: rgba(255, 255, 255, 0.15);
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --accent-glow: rgba(168, 85, 247, 0.45);
      --text-main: #faf5ff;
      --text-muted: #71717a;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010206;
      font-family: var(--font-family);
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Canvas 3D de BabylonJS */
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      outline: none;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-panel);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Botón flotante para alternar panel */
    #togglePanelBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 110;
      background: var(--bg-panel);
      backdrop-filter: var(--panel-blur);
      -webkit-backdrop-filter: var(--panel-blur);
      border: 1px solid var(--border-panel);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
    }
    #togglePanelBtn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      transform: scale(1.05);
    }

    /* Panel de Configuración Glassmorphism */
    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--bg-panel);
      backdrop-filter: var(--panel-blur);
      -webkit-backdrop-filter: var(--panel-blur);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      padding: 20px 18px;
      font-size: 13px;
      line-height: 1.45;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    #panel.collapsed {
      transform: translateX(calc(100% + 30px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-panel);
    }
    .panel-header h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-agent {
      font-size: 9px;
      padding: 3px 7px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .section {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Filas de control */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      gap: 10px;
    }
    .control-row label {
      color: var(--text-main);
      font-size: 12px;
    }
    .val-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      min-width: 32px;
      text-align: right;
    }

    /* Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 130px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
      transition: transform 0.15s ease, background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* Checkboxes */
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }
    .checkbox-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-panel);
    }
    .checkbox-item input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    /* Selects */
    select {
      width: 100%;
      background: rgba(15, 20, 35, 0.85);
      border: 1px solid var(--border-panel);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Botones */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn.paused {
      background: linear-gradient(135deg, #e11d48, #be123c);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
    }

    /* Panel de Información Inferior Izquierdo */
    #infoHud {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 100;
      background: var(--bg-panel);
      backdrop-filter: var(--panel-blur);
      -webkit-backdrop-filter: var(--panel-blur);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 11px;
      color: var(--text-muted);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 320px;
    }
    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-main);
      font-weight: 600;
    }
    .metric-tag {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .fps-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .hud-instructions {
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 4px;
    }

    /* Responsive para pantallas < 600px */
    @media (max-width: 600px) {
      #panel {
        width: calc(100vw - 32px);
        top: auto;
        bottom: 16px;
        max-height: 60vh;
      }
      #panel.collapsed {
        transform: translateY(calc(100% + 30px));
      }
      #infoHud {
        display: none;
      }
    }
  </style>

  <!-- BabylonJS CDN Oficial (Regla Absoluta: Validado) -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <!-- Canvas 3D -->
  <canvas id="renderCanvas"></canvas>

  <!-- Botón de apertura/cierre de panel -->
  <button id="togglePanelBtn" title="Alternar Panel de Configuración">⚙️</button>

  <!-- Panel de Configuración Glassmorphism -->
  <div id="panel">
    <div class="panel-header">
      <h2>🌌 Sistema Solar 3D</h2>
      <span class="badge-agent">Gemini 3.7 Flash</span>
    </div>

    <!-- SECCIÓN 1: TIEMPO Y VELOCIDAD -->
    <div class="section">
      <div class="section-title">⏱️ Sección 1 — Tiempo y Velocidad</div>
      <div class="control-row">
        <label for="speedGlobal">Velocidad global:</label>
        <input type="range" id="speedGlobal" min="0" max="10" step="0.1" value="1.0" />
        <span class="val-badge" id="speedGlobalVal">1.0x</span>
      </div>
      <div class="control-row">
        <label for="speedOrbit">Multiplicador orbital:</label>
        <input type="range" id="speedOrbit" min="0.1" max="3" step="0.1" value="1.0" />
        <span class="val-badge" id="speedOrbitVal">1.0x</span>
      </div>
      <button class="btn" id="pauseBtn">⏸️ Pausar Simulación</button>
    </div>

    <!-- SECCIÓN 2: VISUALIZACIÓN -->
    <div class="section">
      <div class="section-title">👁️ Sección 2 — Visualización</div>
      <div class="checkbox-grid">
        <label class="checkbox-item">
          <input type="checkbox" id="chkOrbits" checked />
          <span>Órbitas</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkLabels" checked />
          <span>Nombres</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkMoons" checked />
          <span>Lunas / Sat.</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkHalley" checked />
          <span>C. Halley</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkHalleyTail" checked />
          <span>Cola Halley</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkAsteroids" checked />
          <span>Asteroides</span>
        </label>
        <label class="checkbox-item" style="grid-column: span 2;">
          <input type="checkbox" id="chkNebulas" checked />
          <span>Nebulosas de fondo</span>
        </label>
      </div>

      <div class="control-row" style="margin-top: 10px;">
        <label for="cameraSelect">Vista de cámara:</label>
      </div>
      <select id="cameraSelect">
        <option value="system" selected>🪐 Sistema Solar (Panorámica)</option>
        <option value="sun">☀️ Sol Cercano</option>
        <option value="earth">🌍 Tierra y Luna</option>
        <option value="mars">🔴 Marte, Fobos y Deimos</option>
        <option value="jupiter">🪐 Júpiter y Lunas Galileanas</option>
        <option value="saturn">🪐 Saturno, Anillos y Titán</option>
        <option value="wide">🔭 Vista Cósmica Panorámica</option>
        <option value="halley">☄️ Seguir Cometa Halley</option>
      </select>

      <div class="control-row" style="margin-top: 10px;">
        <label for="scalePlanets">Tamaño planetario:</label>
        <input type="range" id="scalePlanets" min="0.5" max="3" step="0.1" value="1.0" />
        <span class="val-badge" id="scalePlanetsVal">1.0x</span>
      </div>
    </div>

    <!-- SECCIÓN 3: ESTÉTICA -->
    <div class="section">
      <div class="section-title">🎨 Sección 3 — Estética</div>
      <div class="control-row">
        <label for="themeSelect">Tema de interfaz:</label>
      </div>
      <select id="themeSelect">
        <option value="futuristic" selected>Futurista Neón (Azul/Cian)</option>
        <option value="classic">Clásico Dorado (Ámbar/Oro)</option>
        <option value="dark">Oscuro Profundo (Violeta)</option>
      </select>

      <div class="control-row" style="margin-top: 8px;">
        <label class="checkbox-item" style="width: 100%;">
          <input type="checkbox" id="chkPostPro" checked />
          <span>Efecto Glow & Bloom (Post-pro)</span>
        </label>
      </div>

      <div class="control-row" style="margin-top: 8px;">
        <label for="sunColorSelect">Color del Sol:</label>
      </div>
      <select id="sunColorSelect">
        <option value="yellow" selected>☀️ Amarillo Estándar (G2V)</option>
        <option value="white">⚪ Enana Blanca (Clase A)</option>
        <option value="orange">🟠 Gigante Naranja (Clase K)</option>
        <option value="red">🔴 Supergigante Roja (Clase M)</option>
      </select>
    </div>

    <!-- SECCIÓN 4: INFORMACIÓN -->
    <div class="section">
      <div class="section-title">ℹ️ Sección 4 — Información</div>
      <div class="control-row">
        <span>Rendimiento:</span>
        <span class="val-badge" id="fpsDisplay">60 FPS</span>
      </div>
      <div class="control-row">
        <span>Mallas en escena:</span>
        <span class="val-badge" id="meshCountDisplay">0</span>
      </div>
    </div>
  </div>

  <!-- HUD Inferior con Métricas e Instrucciones -->
  <div id="infoHud">
    <div class="hud-metrics">
      <div class="metric-tag">
        <span class="fps-dot" id="fpsDot"></span>
        <span id="hudFps">60 FPS</span>
      </div>
      <div class="metric-tag">
        <span>Objetos:</span>
        <span id="hudMeshes">0</span>
      </div>
    </div>
    <div class="hud-instructions">
      🖱️ Click izq: rotar | 🔄 Rueda: zoom suave | 👆 Click der: panoramizar (pan)
    </div>
  </div>

    /**
     * Genera una textura de flare/partícula circular con gradiente suave.
     */
    function makeFlareTexture(colorCenter = '#ffffff', colorOuter = 'rgba(255,180,50,0)') {
      const size = 128;
      const texture = new BABYLON.DynamicTexture('flareTex_' + Math.random(), size, scene, false);
      const ctx = texture.getContext();
      ctx.clearRect(0, 0, size, size);

      const rad = size / 2;
      const grad = ctx.createRadialGradient(rad, rad, 0, rad, rad, rad);
      grad.addColorStop(0, colorCenter);
      grad.addColorStop(0.3, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.7, colorOuter);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      texture.hasAlpha = true;
      texture.update();
      return texture;
    }

    /**
     * Genera una textura para etiqueta flotante de texto.
     */
    function makeLabelTexture(text, isMoon = false) {
      const width = isMoon ? 180 : 256;
      const height = isMoon ? 48 : 64;
      const texture = new BABYLON.DynamicTexture('labelTex_' + text, { width, height }, scene, false);
      const ctx = texture.getContext();
      ctx.clearRect(0, 0, width, height);

      // Fondo redondeado semi-transparente
      ctx.fillStyle = isMoon ? 'rgba(15, 23, 42, 0.75)' : 'rgba(10, 15, 30, 0.80)';
      ctx.strokeStyle = isMoon ? 'rgba(148, 163, 184, 0.45)' : 'rgba(120, 160, 255, 0.55)';
      ctx.lineWidth = isMoon ? 1.5 : 2;
      ctx.beginPath();
      ctx.roundRect(6, 6, width - 12, height - 12, isMoon ? 8 : 12);
      ctx.fill();
      ctx.stroke();

      // Texto nítido
      ctx.font = isMoon ? 'bold 16px system-ui, sans-serif' : 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = isMoon ? '#e2e8f0' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, height / 2);

      texture.hasAlpha = true;
      texture.update();
      return texture;
    }

    /**
     * Genera texturas procedurales detalladas para planetas y lunas.
     */
    function makePlanetTexture(data) {
      const width = 512;
      const height = 256;
      const texture = new BABYLON.DynamicTexture('tex_' + data.name, { width, height }, scene, false);
      const ctx = texture.getContext();

      ctx.fillStyle = data.colorHex;
      ctx.fillRect(0, 0, width, height);

      if (data.type === 'earth') {
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 18; i++) {
          const cx = Math.random() * width;
          const cy = 40 + Math.random() * (height - 80);
          ctx.beginPath();
          ctx.arc(cx, cy, 25 + Math.random() * 45, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#b45309';
        for (let i = 0; i < 10; i++) {
          const cx = Math.random() * width;
          const cy = 60 + Math.random() * (height - 120);
          ctx.beginPath();
          ctx.arc(cx, cy, 15 + Math.random() * 20, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        for (let y = 30; y < height - 30; y += 18) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * width, y, 40 + Math.random() * 90, 8 + Math.random() * 12, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, 18);
        ctx.fillRect(0, height - 18, width, 18);
      } else if (data.type === 'jupiter') {
        const bandColors = ['#92400e', '#d97706', '#b45309', '#fef3c7', '#78350f', '#fde68a'];
        let curY = 0;
        while (curY < height) {
          const bandHeight = 6 + Math.random() * 16;
          ctx.fillStyle = bandColors[Math.floor(Math.random() * bandColors.length)];
          ctx.fillRect(0, curY, width, bandHeight);
          curY += bandHeight;
        }

        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.ellipse(width * 0.65, height * 0.62, 35, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 3;
        ctx.stroke();
      } else if (data.type === 'saturn') {
        const saturnBands = ['#fef08a', '#fde047', '#eab308', '#ca8a04', '#a16207'];
        let curY = 0;
        while (curY < height) {
          const h = 8 + Math.random() * 18;
          ctx.fillStyle = saturnBands[Math.floor(Math.random() * saturnBands.length)];
          ctx.fillRect(0, curY, width, h);
          curY += h;
        }
      } else if (data.type === 'mars') {
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#7f1d1d';
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * width, Math.random() * height, 8 + Math.random() * 18, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, 10);
        ctx.fillRect(0, height - 8, width, 8);
      } else if (data.type === 'moon_luna') {
        // Textura lunar con maria oscuros y cráteres claros
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#475569';
        for (let i = 0; i < 20; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * width, Math.random() * height, 15 + Math.random() * 35, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#f1f5f9';
        for (let i = 0; i < 50; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * width, Math.random() * height, 2 + Math.random() * 6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (data.type === 'moon_io') {
        ctx.fillStyle = '#eab308';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#78350f';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * width, Math.random() * height, 4 + Math.random() * 10, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (data.type === 'moon_europa') {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 25; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * width, Math.random() * height);

        }
      } else if (data.type === 'moon_titan') {
        ctx.fillStyle = '#f97316';

          ctx.fill();
        }

        ctx.fillStyle = '#4b5563';

    /**
     * Genera textura para anillos concéntricos planetarios.
     */
    function makeRingTexture(baseColorHex) {
      const size = 512;
      const texture = new BABYLON.DynamicTexture('ringTex_' + Math.random(), size, scene, false);
      const ctx = texture.getContext();
      ctx.clearRect(0, 0, size, size);

      const rad = size / 2;
      for (let r = rad * 0.45; r < rad * 0.95; r += 2) {
        const norm = (r - rad * 0.45) / (rad * 0.5);
        let alpha = 0.5 + 0.4 * Math.sin(norm * 25);
        if (norm > 0.65 && norm < 0.72) {
          alpha = 0.05; // División de Cassini
        }

        ctx.strokeStyle = `rgba(245, 215, 150, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(rad, rad, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      texture.hasAlpha = true;
      texture.update();
      return texture;
    }

    /**
     * Genera texturas orgánicas para nebulosas profundas SIN bordes cuadrados.
     * Utiliza múltiples puffs gaussianos suaves con caída exponencial a cero estricto.
     */
    function makeNebulaOrganicTexture(c1, c2, c3) {
      const size = 512;
      const texture = new BABYLON.DynamicTexture('nebulaTex_' + Math.random(), size, scene, false);
      const ctx = texture.getContext();
      ctx.clearRect(0, 0, size, size);

      const center = size / 2;

      // Puffs orgánicos contenidos estrictamente dentro del radio seguro
      const puffs = [
        { x: 0, y: 0, r: 120, col: c1, a: 0.32 },
        { x: -35, y: 25, r: 100, col: c2, a: 0.26 },
        { x: 40, y: -20, r: 105, col: c3, a: 0.24 },
        { x: 20, y: 35, r: 90, col: c1, a: 0.22 },
        { x: -30, y: -30, r: 95, col: c2, a: 0.22 },
        { x: 15, y: -40, r: 80, col: c3, a: 0.20 },
        { x: -45, y: 5, r: 85, col: c1, a: 0.18 },
        { x: 40, y: 20, r: 80, col: c2, a: 0.18 }
      ];

      puffs.forEach(p => {
        const px = center + p.x;
        const py = center + p.y;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, p.r);

        grad.addColorStop(0, p.col.replace('ALPHA', p.a.toString()));
        grad.addColorStop(0.35, p.col.replace('ALPHA', (p.a * 0.65).toFixed(3)));
        grad.addColorStop(0.7, p.col.replace('ALPHA', (p.a * 0.2).toFixed(3)));
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      texture.hasAlpha = true;
      texture.update();
      return texture;
    }

    let sunMesh = null;
    let sunMaterial = null;
    let sunCoronaSystem = null;

    function createSun() {
      sunMesh = BABYLON.MeshBuilder.CreateSphere('sunMesh', {
        diameter: 18,
        segments: 32
      }, scene);
      sunMesh.position = BABYLON.Vector3.Zero();

      sunMaterial = new BABYLON.StandardMaterial('sunMat', scene);
      sunMaterial.emissiveColor = SUN_CONFIGS.yellow.emissive.clone();
      sunMaterial.diffuseColor = SUN_CONFIGS.yellow.diffuse.clone();
      sunMaterial.specularColor = BABYLON.Color3.Black();

      const solarTex = new BABYLON.DynamicTexture('sunGranules', 256, scene, false);
      const sCtx = solarTex.getContext();
      sCtx.fillStyle = '#ffaa00';
      sCtx.fillRect(0, 0, 256, 256);
      sCtx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let i = 0; i < 300; i++) {
        sCtx.beginPath();
        sCtx.arc(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 4, 0, Math.PI * 2);
        sCtx.fill();
      }
      solarTex.update();
      sunMaterial.emissiveTexture = solarTex;

      sunMesh.material = sunMaterial;

      try {
        BABYLON.ParticleHelper.CreateAsync("sun", scene).then((systemSet) => {
          sunCoronaSystem = systemSet;
          if (sunCoronaSystem && sunCoronaSystem.systems) {
            sunCoronaSystem.systems.forEach(s => {
              s.emitter = sunMesh;
            });
          }
        }).catch(() => {
          createFallbackSunCorona();
        });
      } catch (e) {
        createFallbackSunCorona();
      }
    }

    function createFallbackSunCorona() {
      if (sunCoronaSystem) return;
      const corona = new BABYLON.ParticleSystem('sunCoronaFallback', 600, scene);
      corona.particleTexture = makeFlareTexture('#fff7ed', 'rgba(255,140,0,0.8)');
      corona.emitter = sunMesh;
      corona.minEmitBox = new BABYLON.Vector3(-1.0, -1.0, -1.0);
      corona.maxEmitBox = new BABYLON.Vector3(1.0, 1.0, 1.0);

      corona.color1 = new BABYLON.Color4(1.0, 0.85, 0.2, 1.0);
      corona.color2 = new BABYLON.Color4(1.0, 0.35, 0.0, 0.8);
      corona.colorDead = new BABYLON.Color4(0.8, 0.0, 0.0, 0.0);

      corona.minSize = 3.0;
      corona.maxSize = 7.5;
      corona.minLifeTime = 0.8;
      corona.maxLifeTime = 1.8;
      corona.emitRate = 180;
      corona.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
      corona.minEmitPower = 0.5;
      corona.maxEmitPower = 2.0;
      corona.updateSpeed = 0.015;
      corona.start();
      sunCoronaSystem = corona;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 8. PLANETAS, ÓRBITAS Y SISTEMA DE LUNAS
    // ═══════════════════════════════════════════════════════════════════

    const planetsList = [];
    const moonsList = [];
    const moonOrbitLines = [];

    function calculateKeplerianPosition(a, e, theta, tilt) {
      const b = a * Math.sqrt(Math.max(0.001, 1 - e * e));
      const x = a * Math.cos(theta) - a * e;
      const z = b * Math.sin(theta);
      const y = z * Math.sin(tilt);
      const finalZ = z * Math.cos(tilt);
      return new BABYLON.Vector3(x, y, finalZ);
    }

    function createPlanets(planetsData) {
      planetsData.forEach((data, index) => {
        const pivot = new BABYLON.TransformNode('pivot_' + data.name, scene);

        const mesh = BABYLON.MeshBuilder.CreateSphere('planet_' + data.name, {
          diameter: data.size * 2,
          segments: 28
        }, scene);
        mesh.parent = pivot;
        mesh.rotation.z = data.axialTilt;

        const mat = new BABYLON.StandardMaterial('mat_' + data.name, scene);
        mat.diffuseTexture = makePlanetTexture(data);
        mat.specularColor = new BABYLON.Color3(0.12, 0.12, 0.12);
        mat.specularPower = 16;
        mesh.material = mat;

        // Atmósfera
        let atmoMesh = null;
        if (data.hasAtmosphere && data.atmoColor) {
          atmoMesh = BABYLON.MeshBuilder.CreateSphere('atmo_' + data.name, {
            diameter: data.size * 2.18,
            segments: 24
          }, scene);
          atmoMesh.parent = mesh;

          const atmoMat = new BABYLON.StandardMaterial('atmoMat_' + data.name, scene);
          atmoMat.emissiveColor = data.atmoColor;
          atmoMat.alpha = 0.28;
          atmoMat.backFaceCulling = false;
          atmoMesh.material = atmoMat;
        }

        // Anillos
        let ringsMesh = null;
        if (data.hasRings) {
          ringsMesh = createSaturnRings(data, mesh);
        }

        // Etiqueta Flotante
        const labelPlane = BABYLON.MeshBuilder.CreatePlane('label_' + data.name, {
          width: 8,
          height: 2
        }, scene);
        labelPlane.parent = mesh;
        labelPlane.position.y = data.size + 2.8;
        labelPlane.billboardMode = BABYLON.TransformNode.BILLBOARDMODE_ALL;

        const labelMat = new BABYLON.StandardMaterial('labelMat_' + data.name, scene);
        labelMat.diffuseTexture = makeLabelTexture(data.name, false);
        labelMat.emissiveColor = BABYLON.Color3.White();
        labelMat.disableLighting = true;
        labelMat.backFaceCulling = false;
        labelPlane.material = labelMat;

        // Posición Kepleriana Inicial
        const initialAngle = (index * (Math.PI * 2 / planetsData.length)) + Math.random() * 0.5;
        const initialPos = calculateKeplerianPosition(
          data.semiMajorAxis,
          data.eccentricity,
          initialAngle,
          data.tilt
        );
        mesh.position = initialPos;

        // ═══════════════════════════════════════════════════════════════
        // CREACIÓN DE LUNAS PARA ESTE PLANETA (Luna, Fobos, Ío, Titán, etc.)
        // ═══════════════════════════════════════════════════════════════
        const planetMoonsData = MOONS_DATA[data.name] || [];
        const planetMoons = [];

        planetMoonsData.forEach((mDatum, mIdx) => {
          const moonMesh = BABYLON.MeshBuilder.CreateSphere('moonMesh_' + mDatum.name, {
            diameter: mDatum.size * 2,
            segments: 18
          }, scene);
          moonMesh.parent = mesh;

          const moonMat = new BABYLON.StandardMaterial('matMoon_' + mDatum.name, scene);
          moonMat.diffuseTexture = makePlanetTexture(mDatum);
          moonMat.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
          moonMesh.material = moonMat;

          // Etiqueta de la luna
          const moonLabel = BABYLON.MeshBuilder.CreatePlane('moonLabel_' + mDatum.name, {
            width: 4.5,
            height: 1.2
          }, scene);
          moonLabel.parent = moonMesh;
          moonLabel.position.y = mDatum.size + 1.2;
          moonLabel.billboardMode = BABYLON.TransformNode.BILLBOARDMODE_ALL;

          const mLabelMat = new BABYLON.StandardMaterial('mLabelMat_' + mDatum.name, scene);
          mLabelMat.diffuseTexture = makeLabelTexture(mDatum.name, true);
          mLabelMat.emissiveColor = BABYLON.Color3.White();
          mLabelMat.disableLighting = true;
          mLabelMat.backFaceCulling = false;
          moonLabel.material = mLabelMat;

          // Órbita circular de la luna alrededor del planeta
          const mPoints = [];
          const mSegs = 60;
          for (let s = 0; s <= mSegs; s++) {
            const mTh = (s / mSegs) * Math.PI * 2;
            const mx = Math.cos(mTh) * mDatum.dist;
            const mz = Math.sin(mTh) * mDatum.dist;
            const my = Math.sin(mTh) * Math.sin(mDatum.tilt) * mDatum.dist;
            mPoints.push(new BABYLON.Vector3(mx, my, mz));
          }

          const mOrbitLine = BABYLON.MeshBuilder.CreateLines('moonOrbit_' + mDatum.name, {
            points: mPoints,
            updatable: false
          }, scene);
          mOrbitLine.parent = mesh;
          mOrbitLine.color = new BABYLON.Color3(0.4, 0.55, 0.75);
          mOrbitLine.alpha = 0.25;
          moonOrbitLines.push(mOrbitLine);

          const initialMoonAngle = mIdx * (Math.PI * 2 / planetMoonsData.length) + Math.random();
          moonMesh.position = new BABYLON.Vector3(
            Math.cos(initialMoonAngle) * mDatum.dist,
            Math.sin(initialMoonAngle) * Math.sin(mDatum.tilt) * mDatum.dist,
            Math.sin(initialMoonAngle) * mDatum.dist
          );

          const moonObj = {
            data: mDatum,
            mesh: moonMesh,
            label: moonLabel,
            orbitLine: mOrbitLine,
            angle: initialMoonAngle,
            baseDist: mDatum.dist,
            baseSize: mDatum.size
          };

          planetMoons.push(moonObj);
          moonsList.push(moonObj);
        });

        planetsList.push({
          data,
          pivot,
          mesh,
          atmoMesh,
          ringsMesh,
          labelPlane,
          moons: planetMoons,
          angle: initialAngle,
          baseSize: data.size
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 9. ÓRBITAS ELÍPTICAS
    // ═══════════════════════════════════════════════════════════════════

    const orbitLines = [];

    function createOrbits(planetsData) {
      planetsData.forEach(data => {
        const points = [];
        const segments = 120;

        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          const pos = calculateKeplerianPosition(
            data.semiMajorAxis,
            data.eccentricity,
            theta,
            data.tilt
          );
          points.push(pos);
        }

        const orbit = BABYLON.MeshBuilder.CreateLines('orbit_' + data.name, {
          points: points,
          updatable: false
        }, scene);

        orbit.color = new BABYLON.Color3(0.28, 0.45, 0.75);
        orbit.alpha = 0.35;
        orbitLines.push(orbit);
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 10. CINTURÓN DE ASTEROIDES (Instanced Meshes)
    // ═══════════════════════════════════════════════════════════════════

    let asteroidRootNode = null;
    const asteroidInstances = [];

    function createAsteroidBelt() {
      asteroidRootNode = new BABYLON.TransformNode('asteroidRoot', scene);

      const baseAsteroid = BABYLON.MeshBuilder.CreateSphere('baseAsteroid', {
        diameter: 0.6,
        segments: 6
      }, scene);
      baseAsteroid.setEnabled(false);

      const astMat = new BABYLON.StandardMaterial('astMat', scene);
      astMat.diffuseColor = new BABYLON.Color3(0.55, 0.5, 0.45);
      astMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      baseAsteroid.material = astMat;

      const asteroidCount = 280;
      const minA = 86;
      const maxA = 104;

      for (let i = 0; i < asteroidCount; i++) {
        const inst = baseAsteroid.createInstance('ast_' + i);
        inst.parent = asteroidRootNode;

        const a = minA + Math.random() * (maxA - minA);
        const ecc = 0.02 + Math.random() * 0.08;
        const theta = Math.random() * Math.PI * 2;
        const tilt = (Math.random() - 0.5) * 0.12;

        const pos = calculateKeplerianPosition(a, ecc, theta, tilt);
        inst.position = pos;

        const s = 0.5 + Math.random() * 1.3;
        inst.scaling = new BABYLON.Vector3(s, s * (0.8 + Math.random() * 0.4), s);

        inst.rotation = new BABYLON.Vector3(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        );

        asteroidInstances.push({
          mesh: inst,
          a,
          ecc,
          theta,
          tilt,
          speed: (0.55 / Math.sqrt(a)) * (0.8 + Math.random() * 0.4),
          rotSpeed: new BABYLON.Vector3(
            (Math.random() - 0.5) * 0.8,
            (Math.random() - 0.5) * 0.8,
            (Math.random() - 0.5) * 0.8
          )
        });
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 11. SISTEMA DE ANILLOS (Saturno y Urano)
    // ═══════════════════════════════════════════════════════════════════

    function createSaturnRings(data, parentMesh) {
      const ringDisc = BABYLON.MeshBuilder.CreateDisc('rings_' + data.name, {
        radius: data.ringOuter,
        tessellation: 64,
        sideOrientation: BABYLON.Mesh.DOUBLESIDE
      }, scene);
      ringDisc.parent = parentMesh;
      ringDisc.rotation.x = Math.PI / 2;

      const ringMat = new BABYLON.StandardMaterial('ringMat_' + data.name, scene);
      ringMat.diffuseTexture = makeRingTexture(data.colorHex);
      ringMat.emissiveColor = new BABYLON.Color3(0.2, 0.18, 0.14);
      ringMat.specularColor = BABYLON.Color3.Black();
      ringMat.backFaceCulling = false;
      ringMat.alpha = data.ringAlpha || 0.85;

      ringDisc.material = ringMat;
      return ringDisc;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 12. COMETA HALLEY Y COLA VECTORIAL ANTI-SOLAR
    // ═══════════════════════════════════════════════════════════════════

    let halleyMesh = null;
    let halleyTailSystem = null;
    let halleyOrbitLine = null;
    let halleyCurrentAngle = 0;

    function createHalley() {
      halleyMesh = BABYLON.MeshBuilder.CreateSphere('halleyCore', {
        diameter: HALLEY_DATA.size * 2,
        segments: 16
      }, scene);

      const hMat = new BABYLON.StandardMaterial('halleyMat', scene);
      hMat.emissiveColor = new BABYLON.Color3(0.85, 0.95, 1.0);
      hMat.diffuseColor = new BABYLON.Color3(0.5, 0.8, 1.0);
      halleyMesh.material = hMat;

      halleyTailSystem = new BABYLON.ParticleSystem('halleyTail', 1400, scene);
      halleyTailSystem.particleTexture = makeFlareTexture('#ffffff', 'rgba(56,189,248,0.7)');
      halleyTailSystem.emitter = halleyMesh;

      halleyTailSystem.minEmitBox = new BABYLON.Vector3(-0.3, -0.3, -0.3);
      halleyTailSystem.maxEmitBox = new BABYLON.Vector3(0.3, 0.3, 0.3);

      halleyTailSystem.color1 = new BABYLON.Color4(1.0, 1.0, 1.0, 1.0);
      halleyTailSystem.color2 = new BABYLON.Color4(0.2, 0.75, 1.0, 0.8);
      halleyTailSystem.colorDead = new BABYLON.Color4(0.05, 0.25, 0.8, 0.0);

      halleyTailSystem.minSize = 0.8;
      halleyTailSystem.maxSize = 3.2;
      halleyTailSystem.minLifeTime = 0.6;
      halleyTailSystem.maxLifeTime = 1.4;
      halleyTailSystem.emitRate = 450;
      halleyTailSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
      halleyTailSystem.minEmitPower = 8;
      halleyTailSystem.maxEmitPower = 18;
      halleyTailSystem.updateSpeed = 0.015;

      halleyTailSystem.start();

      const hPoints = [];
      const segs = 140;
      for (let i = 0; i <= segs; i++) {
        const th = (i / segs) * Math.PI * 2;
        const pos = calculateKeplerianPosition(
          HALLEY_DATA.semiMajorAxis,
          HALLEY_DATA.eccentricity,
          th,
          HALLEY_DATA.tilt
        );
        hPoints.push(pos);
      }

      halleyOrbitLine = BABYLON.MeshBuilder.CreateLines('halleyOrbit', {
        points: hPoints,
        updatable: false
      }, scene);
      halleyOrbitLine.color = new BABYLON.Color3(0.38, 0.82, 0.98);
      halleyOrbitLine.alpha = 0.45;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 13. NEBULOSAS CÓSMICAS (Suaves, Orgánicas, Sin Bordes Cuadrados)
    // ═══════════════════════════════════════════════════════════════════

          c1: 'rgba(236, 72, 153, ALPHA)',

          size: 750
        },
        {
          name: 'Nebulosa del Velo',
          pos: new BABYLON.Vector3(-1400, -400, 1150),
          c1: 'rgba(6, 182, 212, ALPHA)',
          c2: 'rgba(59, 130, 246, ALPHA)',
          c3: 'rgba(16, 185, 129, ALPHA)',
          size: 850
        },
        {
          name: 'Nebulosa de Carina',
          pos: new BABYLON.Vector3(1150, -550, -1350),
          c1: 'rgba(249, 115, 22, ALPHA)',
          c2: 'rgba(239, 68, 68, ALPHA)',
          c3: 'rgba(234, 179, 8, ALPHA)',
          size: 800
        },
        {
          name: 'Nebulosa de la Laguna',
          pos: new BABYLON.Vector3(-1250, 650, -1250),
          c1: 'rgba(168, 85, 247, ALPHA)',
          c2: 'rgba(236, 72, 153, ALPHA)',
          c3: 'rgba(14, 165, 233, ALPHA)',

        },
        {

    // ═══════════════════════════════════════════════════════════════════
    // 14. POST-PROCESADO (DefaultRenderingPipeline + GlowLayer)
    // ═══════════════════════════════════════════════════════════════════

    let defaultPipeline = null;
    let glowLayer = null;

    function setupPostProcessing() {
      try {
        glowLayer = new BABYLON.GlowLayer('glow', scene, {
          mainTextureRatio: 0.5,
          blurKernelSize: 32
        });
        glowLayer.intensity = 0.65;

        defaultPipeline = new BABYLON.DefaultRenderingPipeline(
          'defaultPipeline',
          true,
          scene,
          [camera]
        );

        defaultPipeline.bloomEnabled = true;
        defaultPipeline.bloomThreshold = 0.6;
        defaultPipeline.bloomWeight = 0.45;
        defaultPipeline.bloomKernel = 64;
        defaultPipeline.bloomScale = 0.5;

        if (defaultPipeline.imageProcessing) {
          defaultPipeline.imageProcessing.toneMappingEnabled = true;
          defaultPipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
          defaultPipeline.imageProcessing.exposure = 1.05;
        }
      } catch (e) {
        console.warn('Post-procesado no soportado en este entorno:', e);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 15. INTERFAZ DE USUARIO Y CONTROLADORES DE EVENTOS
    // ═══════════════════════════════════════════════════════════════════

    function setupUI() {
      const panel = document.getElementById('panel');
      const togglePanelBtn = document.getElementById('togglePanelBtn');
      togglePanelBtn.addEventListener('click', () => {
        panel.classList.toggle('collapsed');
      });

      // SECCIÓN 1: Tiempo y Velocidad
      const speedGlobalInput = document.getElementById('speedGlobal');
      const speedGlobalVal = document.getElementById('speedGlobalVal');
      speedGlobalInput.addEventListener('input', (e) => {
        STATE.globalSpeed = parseFloat(e.target.value);
        speedGlobalVal.textContent = STATE.globalSpeed.toFixed(1) + 'x';
      });

      const speedOrbitInput = document.getElementById('speedOrbit');
      const speedOrbitVal = document.getElementById('speedOrbitVal');
      speedOrbitInput.addEventListener('input', (e) => {
        STATE.orbitSpeedMult = parseFloat(e.target.value);
        speedOrbitVal.textContent = STATE.orbitSpeedMult.toFixed(1) + 'x';
      });

      const pauseBtn = document.getElementById('pauseBtn');
      pauseBtn.addEventListener('click', () => {
        STATE.isPaused = !STATE.isPaused;
        if (STATE.isPaused) {
          pauseBtn.textContent = '▶️ Reanudar Simulación';
          pauseBtn.classList.add('paused');
        } else {
          pauseBtn.textContent = '⏸️ Pausar Simulación';
          pauseBtn.classList.remove('paused');
        }
      });

      // SECCIÓN 2: Visualización
      document.getElementById('chkOrbits').addEventListener('change', (e) => {
        STATE.showOrbits = e.target.checked;
        orbitLines.forEach(l => l.setEnabled(STATE.showOrbits));
        moonOrbitLines.forEach(l => l.setEnabled(STATE.showOrbits && STATE.showMoons));
        if (halleyOrbitLine) halleyOrbitLine.setEnabled(STATE.showOrbits && STATE.showHalley);
      });

      document.getElementById('chkLabels').addEventListener('change', (e) => {
        STATE.showLabels = e.target.checked;
        planetsList.forEach(p => p.labelPlane.setEnabled(STATE.showLabels));
        moonsList.forEach(m => m.label.setEnabled(STATE.showLabels && STATE.showMoons));
      });

      document.getElementById('chkMoons').addEventListener('change', (e) => {
        STATE.showMoons = e.target.checked;
        moonsList.forEach(m => {
          m.mesh.setEnabled(STATE.showMoons);
          m.label.setEnabled(STATE.showMoons && STATE.showLabels);
          m.orbitLine.setEnabled(STATE.showMoons && STATE.showOrbits);
        });
      });

      document.getElementById('chkHalley').addEventListener('change', (e) => {
        STATE.showHalley = e.target.checked;
        if (halleyMesh) halleyMesh.setEnabled(STATE.showHalley);
        if (halleyTailSystem) {
          if (STATE.showHalley && STATE.showHalleyTail) halleyTailSystem.start();
          else halleyTailSystem.stop();
        }
        if (halleyOrbitLine) halleyOrbitLine.setEnabled(STATE.showHalley && STATE.showOrbits);
      });

      document.getElementById('chkHalleyTail').addEventListener('change', (e) => {
        STATE.showHalleyTail = e.target.checked;
        if (halleyTailSystem) {
          if (STATE.showHalley && STATE.showHalleyTail) halleyTailSystem.start();
          else halleyTailSystem.stop();
        }
      });

      document.getElementById('chkAsteroids').addEventListener('change', (e) => {
        STATE.showAsteroids = e.target.checked;
        if (asteroidRootNode) asteroidRootNode.setEnabled(STATE.showAsteroids);
      });

      document.getElementById('chkNebulas').addEventListener('change', (e) => {
        STATE.showNebulas = e.target.checked;
        nebulaMeshes.forEach(m => m.setEnabled(STATE.showNebulas));
      });

      // Vistas de Cámara Cinemáticas
      const cameraSelect = document.getElementById('cameraSelect');
      cameraSelect.addEventListener('change', (e) => {
        STATE.currentView = e.target.value;
        focusCameraView(STATE.currentView);
      });

      // Escala Planetaria
      const scalePlanetsInput = document.getElementById('scalePlanets');
      const scalePlanetsVal = document.getElementById('scalePlanetsVal');
      scalePlanetsInput.addEventListener('input', (e) => {
        STATE.planetScale = parseFloat(e.target.value);
        scalePlanetsVal.textContent = STATE.planetScale.toFixed(1) + 'x';
        planetsList.forEach(p => {
          p.mesh.scaling.setAll(STATE.planetScale);
          p.labelPlane.position.y = (p.baseSize * STATE.planetScale) + 2.8;
        });
      });

      // SECCIÓN 3: Estética
      document.getElementById('themeSelect').addEventListener('change', (e) => {
        document.body.className = '';
        if (e.target.value === 'classic') document.body.classList.add('theme-classic');
        else if (e.target.value === 'dark') document.body.classList.add('theme-dark');
      });

      document.getElementById('chkPostPro').addEventListener('change', (e) => {
        STATE.postProEnabled = e.target.checked;
        if (defaultPipeline) defaultPipeline.bloomEnabled = STATE.postProEnabled;
        if (glowLayer) glowLayer.isEnabled = STATE.postProEnabled;
      });

      document.getElementById('sunColorSelect').addEventListener('change', (e) => {
        STATE.activeSunTheme = e.target.value;
        const cfg = SUN_CONFIGS[STATE.activeSunTheme];
        if (cfg && sunMaterial) {
          sunMaterial.emissiveColor = cfg.emissive.clone();
          sunMaterial.diffuseColor = cfg.diffuse.clone();
          sunLight.diffuse = cfg.lightColor.clone();
          if (sunCoronaSystem && sunCoronaSystem.color1) {
            sunCoronaSystem.color1 = cfg.particleColor1.clone();
            sunCoronaSystem.color2 = cfg.particleColor2.clone();
          }
        }
      });
    }

    function focusCameraView(viewKey) {
      let targetPos = BABYLON.Vector3.Zero();
      let targetRadius = 200;
      let targetAlpha = camera.alpha;
      let targetBeta = Math.PI / 2.7;

      switch (viewKey) {
        case 'system':
          targetPos = BABYLON.Vector3.Zero();
          targetRadius = 200;
          targetBeta = Math.PI / 2.7;
          break;
        case 'sun':
          targetPos = BABYLON.Vector3.Zero();
          targetRadius = 38;
          targetBeta = Math.PI / 2.4;
          break;
        case 'earth':
          const earth = planetsList.find(p => p.data.name === 'Tierra');
          if (earth) targetPos = earth.mesh.absolutePosition.clone();
          targetRadius = 18;
          targetBeta = Math.PI / 2.3;
          break;
        case 'mars':
          const mars = planetsList.find(p => p.data.name === 'Marte');
          if (mars) targetPos = mars.mesh.absolutePosition.clone();
          targetRadius = 16;
          targetBeta = Math.PI / 2.3;
          break;
        case 'jupiter':
          const jupiter = planetsList.find(p => p.data.name === 'Júpiter');
          if (jupiter) targetPos = jupiter.mesh.absolutePosition.clone();
          targetRadius = 45;
          targetBeta = Math.PI / 2.4;
          break;
        case 'saturn':
          const saturn = planetsList.find(p => p.data.name === 'Saturno');
          if (saturn) targetPos = saturn.mesh.absolutePosition.clone();
          targetRadius = 38;
          targetBeta = Math.PI / 2.3;
          break;
        case 'wide':
          targetPos = BABYLON.Vector3.Zero();
          targetRadius = 550;
          targetBeta = Math.PI / 3.2;
          break;
        case 'halley':
          if (halleyMesh) targetPos = halleyMesh.absolutePosition.clone();
          targetRadius = 22;
          targetBeta = Math.PI / 2.4;
          break;
      }

      STATE.cameraTransition = {
        startAlpha: camera.alpha,
        targetAlpha,
        startBeta: camera.beta,
        targetBeta,
        startRadius: camera.radius,
        targetRadius,
        startTarget: camera.target.clone(),
        targetTarget: targetPos,
        progress: 0
      };
    }

    // ═══════════════════════════════════════════════════════════════════
    // 16. RENDER LOOP Y ANIMACIONES CON DELTATIME
    // ═══════════════════════════════════════════════════════════════════

    let elapsedTime = 0;
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    scene.onBeforeRenderObservable.add(() => {
      const dt = engine.getDeltaTime() / 1000;
      if (dt > 0.5) return;

      // 1. Transición cinemática de cámara
      if (STATE.cameraTransition) {
        const tr = STATE.cameraTransition;
        tr.progress += dt * 2.2;
        const ease = Math.min(1.0, tr.progress);
        const smoothT = ease * ease * (3 - 2 * ease);

        camera.radius = tr.startRadius + (tr.targetRadius - tr.startRadius) * smoothT;
        camera.beta = tr.startBeta + (tr.targetBeta - tr.startBeta) * smoothT;
        camera.target = BABYLON.Vector3.Lerp(tr.startTarget, tr.targetTarget, smoothT);

        if (ease >= 1.0) {
          STATE.cameraTransition = null;
        }
      }

      // Seguir suavemente objetivos si una vista de planeta está seleccionada
      if (!STATE.cameraTransition) {
        if (STATE.currentView === 'earth') {
          const earth = planetsList.find(p => p.data.name === 'Tierra');
          if (earth) camera.target.copyFrom(earth.mesh.absolutePosition);
        } else if (STATE.currentView === 'mars') {
          const mars = planetsList.find(p => p.data.name === 'Marte');
          if (mars) camera.target.copyFrom(mars.mesh.absolutePosition);
        } else if (STATE.currentView === 'jupiter') {
          const jup = planetsList.find(p => p.data.name === 'Júpiter');
          if (jup) camera.target.copyFrom(jup.mesh.absolutePosition);
        } else if (STATE.currentView === 'saturn') {
          const sat = planetsList.find(p => p.data.name === 'Saturno');
          if (sat) camera.target.copyFrom(sat.mesh.absolutePosition);
        } else if (STATE.currentView === 'halley') {
          if (halleyMesh) camera.target.copyFrom(halleyMesh.absolutePosition);
        }
      }

      // 2. Animación del Sol
      if (sunMesh) {
        sunMesh.rotation.y += dt * 0.25 * (STATE.isPaused ? 0 : STATE.globalSpeed);
        const pulse = 1.0 + Math.sin(elapsedTime * 2.1) * 0.04;
        sunMesh.scaling.setAll(pulse);
      }

      if (!STATE.isPaused) {
        elapsedTime += dt * STATE.globalSpeed;

        // 3. Animación de Planetas y Órbitas Keplerianas
        planetsList.forEach(p => {
          const orbitalAngularSpeed = (p.data.speed / Math.sqrt(p.data.semiMajorAxis)) * 3.5;
          p.angle += dt * orbitalAngularSpeed * STATE.globalSpeed * STATE.orbitSpeedMult;

          const newPos = calculateKeplerianPosition(
            p.data.semiMajorAxis,
            p.data.eccentricity,
            p.angle,
            p.data.tilt
          );
          p.mesh.position = newPos;
          p.mesh.rotation.y += dt * p.data.rotSpeed * STATE.globalSpeed;

          // 4. Animación de Lunas orbitando cada planeta
          if (p.moons && p.moons.length > 0) {
            p.moons.forEach(m => {
              m.angle += dt * m.data.speed * STATE.globalSpeed * STATE.orbitSpeedMult;
              m.mesh.position.x = Math.cos(m.angle) * m.data.dist;
              m.mesh.position.z = Math.sin(m.angle) * m.data.dist;
              m.mesh.position.y = Math.sin(m.angle) * Math.sin(m.data.tilt) * m.data.dist;
              m.mesh.rotation.y += dt * 1.5 * STATE.globalSpeed;
            });
          }
        });

        // 5. Animación del Cometa Halley y Cola Vectorial Anti-Solar
        if (halleyMesh) {
          const halleyAngularSpeed = (Math.PI * 2 / HALLEY_DATA.period);
          halleyCurrentAngle += dt * halleyAngularSpeed * STATE.globalSpeed * STATE.orbitSpeedMult;

          const hPos = calculateKeplerianPosition(
            HALLEY_DATA.semiMajorAxis,
            HALLEY_DATA.eccentricity,
            halleyCurrentAngle,
            HALLEY_DATA.tilt
          );
          halleyMesh.position = hPos;

          const antiSolar = hPos.subtract(BABYLON.Vector3.Zero()).normalize();

          if (halleyTailSystem) {
            halleyTailSystem.direction1 = antiSolar.scale(1.2).add(new BABYLON.Vector3(0.2, 0.2, 0.2));
            halleyTailSystem.direction2 = antiSolar.scale(1.2).subtract(new BABYLON.Vector3(0.2, 0.2, 0.2));
          }
        }

        // 6. Animación de Asteroides
        if (STATE.showAsteroids) {
          asteroidInstances.forEach(ast => {
            ast.theta += dt * ast.speed * STATE.globalSpeed * STATE.orbitSpeedMult;
            ast.mesh.position = calculateKeplerianPosition(ast.a, ast.ecc, ast.theta, ast.tilt);
            ast.mesh.rotation.x += dt * ast.rotSpeed.x * STATE.globalSpeed;
            ast.mesh.rotation.y += dt * ast.rotSpeed.y * STATE.globalSpeed;
            ast.mesh.rotation.z += dt * ast.rotSpeed.z * STATE.globalSpeed;
          });
        }
      }

      // 7. Actualización de HUD y FPS
      frameCount++;
      const now = performance.now();
      if (now - lastFpsUpdate >= 400) {
        const fps = Math.round(engine.getFps());
        const meshCount = scene.meshes.length;

        document.getElementById('fpsDisplay').textContent = fps + ' FPS';
        document.getElementById('hudFps').textContent = fps + ' FPS';
        document.getElementById('meshCountDisplay').textContent = meshCount;
        document.getElementById('hudMeshes').textContent = meshCount;

        const dot = document.getElementById('fpsDot');
        if (fps >= 50) {
          dot.style.background = '#10b981';
          dot.style.boxShadow = '0 0 6px #10b981';
        } else if (fps >= 30) {
          dot.style.background = '#f59e0b';
          dot.style.boxShadow = '0 0 6px #f59e0b';
        } else {
          dot.style.background = '#ef4444';
          dot.style.boxShadow = '0 0 6px #ef4444';
        }

        lastFpsUpdate = now;
      }
    });

    // ═══════════════════════════════════════════════════════════════════
    // 17. INICIALIZACIÓN GLOBAL Y RESIZE
    // ═══════════════════════════════════════════════════════════════════

    function initUniverse() {
      createStars();
      createSun();
      createPlanets(PLANETS_DATA);
      createOrbits(PLANETS_DATA);
      createAsteroidBelt();
      createHalley();
      createNebulas();
      setupPostProcessing();
      setupUI();

      engine.runRenderLoop(() => {
        scene.render();
      });

      window.addEventListener('resize', () => {
        engine.resize();
      });
    }

    window.addEventListener('DOMContentLoaded', initUniverse);
  </script>
</body>
